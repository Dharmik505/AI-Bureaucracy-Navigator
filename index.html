<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Bureaucracy Navigator - Indian Government Schemes</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.container{background:white;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:800px;width:100%;overflow:hidden}.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:30px;text-align:center}.header h1{font-size:32px;margin-bottom:10px}.header p{font-size:16px;opacity:0.9}.chatbox{height:400px;overflow-y:auto;padding:20px;background:#f5f5f5;display:flex;flex-direction:column}.message{margin:10px 0;padding:12px 15px;border-radius:8px;max-width:80%;animation:slideIn 0.3s ease}.message.user{background:#667eea;color:white;margin-left:auto}.message.bot{background:#e0e0e0;color:#333}.input-section{padding:20px;background:white;border-top:1px solid #ddd;display:flex;gap:10px}.input-section input{flex:1;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:16px}.input-section button{padding:12px 25px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;transition:0.3s}.input-section button:hover{transform:scale(1.05)}.question{padding:20px;border-bottom:1px solid #eee}.question label{display:block;font-weight:bold;margin-bottom:8px;color:#333}.question input, .question select{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:5px}.results{padding:20px;max-height:500px;overflow-y:auto}.scheme-card{background:#f9f9f9;border-left:4px solid #667eea;padding:15px;margin:10px 0;border-radius:5px}.scheme-card h3{color:#667eea;margin-bottom:8px}.scheme-card p{color:#666;font-size:14px;line-height:1.5}@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.header h1{font-size:24px}.scheme-card{padding:12px}}</style></head><body><div class="container"><div class="header"><h1>AI Bureaucracy Navigator</h1><p>Find Indian Government Schemes & Subsidies</p></div><div id="mainContent"><div style="padding:20px"><h2>Tell us about yourself</h2><div class="question"><label>Annual Household Income:</label><input type="number" id="income" placeholder="Enter in rupees" min="0"></div><div class="question"><label>Employment Status:</label><select id="employment"><option>Select...</option><option>Self-Employed</option><option>Farmer</option><option>Student</option><option>Unemployed</option><option>Salaried Employee</option><option>Retired</option></select></div><div class="question"><label>Category:</label><select id="category"><option>Select...</option><option>General</option><option>SC/ST</option><option>OBC</option><option>Minority</option></select></div><div class="question"><label>State:</label><select id="state"><option>Select...</option><option>Andhra Pradesh</option><option>Arunachal Pradesh</option><option>Assam</option><option>Bihar</option><option>Chhattisgarh</option><option>Goa</option><option>Gujarat</option><option>Haryana</option><option>Himachal Pradesh</option><option>Jharkhand</option><option>Karnataka</option><option>Kerala</option><option>Madhya Pradesh</option><option>Maharashtra</option><option>Manipur</option><option>Meghalaya</option><option>Mizoram</option><option>Nagaland</option><option>Odisha</option><option>Punjab</option><option>Rajasthan</option><option>Sikkim</option><option>Tamil Nadu</option><option>Telangana</option><option>Tripura</option><option>Uttar Pradesh</option><option>Uttarakhand</option><option>West Bengal</option></select></div><div class="question"><label>Age Group:</label><select id="ageGroup"><option>Select...</option><option>Below 18</option><option>18-25</option><option>25-40</option><option>40-60</option><option>Above 60</option></select></div><div class="question"><label>Have Children:</label><select id="children"><option>Select...</option><option>No</option><option>Yes - Up to 2</option><option>Yes - More than 2</option></select></div><button onclick="analyzeProfile()" style="width:100%;padding:12px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px">Find My Schemes</button></div><div id="results" style="display:none"><div class="results"><h2>Recommended Schemes for You</h2><div id="schemesList"></div></div></div></div></div><script>const schemesDatabase=[{name:'Pradhan Mantri Mudra Yojana (PMMY)',eligibility:['Self-Employed','Farmer','Small Business'],income:50000,description:'Up to Rs. 10 lakh loans without collateral for small business and entrepreneurship',category:'Business Loan'},{name:'Pradhan Mantri Awas Yojana (PMAY)',eligibility:['Self-Employed','Salaried Employee','Farmer'],income:1200000,description:'Subsidized housing loans for affordable housing construction and purchase',category:'Housing'},{name:'PM-Kisan',eligibility:['Farmer'],income:5000000,description:'Rs. 6,000 per year in installments to farmer families',category:'Farmer Benefit'},{name:'Ayushman Bharat',eligibility:['General','SC/ST','OBC','Minority'],income:500000,description:'Free health insurance cover of Rs. 5 lakhs per family per year',category:'Health Insurance'},{name:'Pradhan Mantri Jan Dhan Yojana (PMJDY)',eligibility:['General','SC/ST','OBC','Minority','Unemployed'],income:1000000,description:'Zero-balance bank accounts with Rs. 1 lakh life insurance and Rs. 30,000 accident insurance',category:'Banking'},{name:'Startup India',eligibility:['Self-Employed','Student'],income:10000000,description:'Fund, training, and mentoring for startups working on business ideas',category:'Startup'},{name:'Prime Minister Employment Generation Programme (PMEGP)',eligibility:['Self-Employed','Unemployed'],income:1000000,description:'Subsidized loans for starting micro and small enterprises',category:'Employment'},{name:'Pradhan Mantri Fasal Bima Yojana (PMFBY)',eligibility:['Farmer'],income:5000000,description:'Crop insurance scheme protecting against crop loss',category:'Farmer Benefit'},{name:'Pradhan Mantri Suraksha Bima Yojana (PMSBY)',eligibility:['General','SC/ST','OBC','Unemployed'],income:1000000,description:'Accident insurance with Rs. 2 lakh coverage for just Rs. 12/year',category:'Insurance'},{name:'Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)',eligibility:['General','SC/ST','OBC','Unemployed'],income:500000,description:'Life insurance of Rs. 2 lakh for just Rs. 436/year',category:'Insurance'},{name:'Pradhan Mantri Kaushal Vikas Yojana (PMKVY)',eligibility:['Unemployed','Student'],income:1000000,description:'Free skill development and vocational training programs',category:'Education'},{name:'Atal Pension Yojana (APY)',eligibility:['Self-Employed','Unemployed','Salaried Employee'],income:1000000,description:'Guaranteed minimum pension of Rs. 1000-5000 per month from age 60',category:'Pension'}];function analyzeProfile(){const income=parseInt(document.getElementById('income').value)||0;const employment=document.getElementById('employment').value;const category=document.getElementById('category').value;const state=document.getElementById('state').value;const ageGroup=document.getElementById('ageGroup').value;const children=document.getElementById('children').value;if(!employment||!category||!state||!ageGroup||!children||income===0){alert('Please fill all fields');return}const matchedSchemes=schemesDatabase.filter(scheme=>{const incomeMatch=income<=scheme.income;const employmentMatch=scheme.eligibility.includes(employment);const categoryMatch=scheme.eligibility.includes(category);return incomeMatch&&employmentMatch&&categoryMatch});const resultsDiv=document.getElementById('results');const schemesList=document.getElementById('schemesList');schemesList.innerHTML='';if(matchedSchemes.length===0){schemesList.innerHTML='<p style="color:#999">No schemes matched. Check back later!</p>'}else{matchedSchemes.forEach(scheme=>{const card=document.createElement('div');card.className='scheme-card';card.innerHTML=`<h3>${scheme.name}</h3><p><strong>Category:</strong> ${scheme.category}</p><p><strong>Description:</strong> ${scheme.description}</p><p style="color:#667eea;margin-top:10px;font-size:13px">Income Limit: Rs. ${scheme.income.toLocaleString('en-IN')}</p>`;schemesList.appendChild(card)})}resultsDiv.style.display='block';document.getElementById('mainContent').querySelector('[style*="padding"]').style.display='none'}</script></body></html>
